<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Which browsers are supported on Mac? | TabLinker FAQ</title>
    <meta name="description" content="Browser support details for TabLinker on Mac.">
    <link rel="canonical" href="https://tablinker.app/faq/which-browsers-are-supported-on-mac">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <style>
        :root {
            --bg: #000;
            --panel: #1d1d1f;
            --text: #f5f5f7;
            --link: #c7cfdb;
            --link-hover: #e0e5ed;
            --border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.65;
        }

        main {
            max-width: 860px;
            margin: 0 auto;
            padding: 40px 20px 64px;
        }

        .back {
            color: var(--link);
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        h1 {
            margin-top: 20px;
            font-size: 40px;
            line-height: 1.15;
            letter-spacing: -0.02em;
        }

        .card {
            margin-top: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }

        p {
            margin-bottom: 12px;
        }

        ul {
            margin: 0 0 0 20px;
        }

        li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <main>
        <a class="back" href="../../index.html">Back to Home</a>
        <h1>Which browsers are supported on Mac?</h1>
        <div class="card">
            <p>TabLinker supports importing tabs from these browsers on Mac:</p>
            <ul>
                <li>Safari</li>
                <li>Google Chrome</li>
                <li>Arc</li>
                <li>Microsoft Edge</li>
                <li>Brave</li>
            </ul>
            <p>Browser availability also depends on your macOS permissions for browser automation/import features.</p>
        </div>
    </main>
</body>
</html>
